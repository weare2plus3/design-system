<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.TwoPlusThree, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'tt-stack', style: { gap: 0 } },
      h(T.Checkbox, { label: 'Gift wrap this order', defaultChecked: true }),
      h(T.Checkbox, { label: 'Add a handwritten note' }),
      h(T.Checkbox, { label: 'Next-day delivery (unavailable)', disabled: true }))
  );
</script>
</body>
</html>
