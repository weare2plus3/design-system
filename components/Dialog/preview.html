<!-- @dsCard group="Overlays" height=340 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog preview</title></head>
<body>
<div id="root" style="height: 340px;"></div>
<script>
  var T = window.TwoPlusThree, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(T.Dialog, {
      open: true, inline: true, title: 'Discard this card?',
      onClose: function () {},
      actions: [
        h(T.Button, { key: 'a', variant: 'secondary' }, 'Keep editing'),
        h(T.Button, { key: 'b' }, 'Discard')
      ]
    }, 'Your message and photo will be lost. This can’t be undone.')
  );
</script>
</body>
</html>
