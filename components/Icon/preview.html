<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.TwoPlusThree, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'tt-row', style: { gap: '20px 28px', padding: 'var(--space-6)' } },
      T.Icon.names.map(function (n) {
        return h('div', { key: n, title: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', width: '64px' } },
          h(T.Icon, { name: n, size: 24 }),
          h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: '10px', color: 'var(--ink-muted)' } }, n));
      }))
  );
</script>
</body>
</html>
