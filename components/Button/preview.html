<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.TwoPlusThree, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', null,
      h('div', { className: 'tt-row' },
        h(T.Button, { iconAfter: 'arrow-right' }, 'See the work'),
        h(T.Button, { variant: 'secondary' }, 'Read the journal'),
        h(T.Button, { variant: 'quiet' }, 'Learn more'),
        h(T.Button, { disabled: true }, 'Sold out')),
      h('div', { className: 'tt-row' },
        h(T.Button, { size: 'sm', icon: 'bag' }, 'Add to basket'),
        h(T.Button, { size: 'sm', variant: 'secondary' }, 'Details')))
  );
</script>
</body>
</html>
