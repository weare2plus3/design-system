<!doctype html>
<html>
<head><meta charset="utf-8"><title>Header preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.TwoPlusThree, h = React.createElement;
  var nav = [
    { label: 'Work', href: '#', current: true },
    { label: 'Books', href: '#' },
    { label: 'Shop', href: '#' },
    { label: 'Journal', href: '#' },
    { label: 'About', href: '#' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--space-8)', paddingBottom: 'var(--space-8)' } },
      h(T.Header, { nav: nav }),
      h(T.Header, { nav: nav, elevated: true, action: h(T.Button, { size: 'sm' }, 'Shop') }))
  );
</script>
</body>
</html>
