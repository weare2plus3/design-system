<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.TwoPlusThree, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'tt-stack' },
      h(T.TextField, { label: 'Email address', type: 'email', placeholder: 'you@example.com', hint: 'Once a month. No spam.' }),
      h(T.TextField, { label: 'Name on the card', defaultValue: 'Jas', error: 'Keep it under 20 letters so it fits the cover.' }))
  );
</script>
</body>
</html>
